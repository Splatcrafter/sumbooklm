name: Publish container image

# Builds the image and pushes it to the container registry of this repository, so that a server
# pulls a finished artifact instead of building one.

# Started by hand, never by a push. Publishing is what puts a version in front of users, and that is
# a moment somebody picks rather than one that follows from a commit landing on the branch. Run it
# from the Actions tab, on the branch or tag that should be published: the tags below are derived
# from whichever ref it was started on.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Maven and npm caches of the build stage live here between runs. Without them every
          # run resolves the whole dependency tree and downloads a Node toolchain again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
