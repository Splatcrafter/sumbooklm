spring:
  datasource:
    url: jdbc:h2:mem:sumbooklm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

sumbooklm:
  security:
    jwt:
      secret: ${SUMBOOKLM_JWT_SECRET:development-only-jwt-signing-secret-0001}
    cookie:
      secret: ${SUMBOOKLM_COOKIE_SECRET:development-only-cookie-derivation-key-01}
      secure: false

logging:
  level:
    de.pfoertner.assessment.sumbooklm: DEBUG
