spring:
  datasource:
    url: ${SUMBOOKLM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sumbooklm}
    username: ${SUMBOOKLM_DATASOURCE_USERNAME:sumbooklm}
    password: ${SUMBOOKLM_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

sumbooklm:
  security:
    jwt:
      secret: ${SUMBOOKLM_JWT_SECRET}
    cookie:
      secret: ${SUMBOOKLM_COOKIE_SECRET}
      secure: true

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    enabled: false
